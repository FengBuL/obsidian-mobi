name: Release

# 推送形如 0.1.1 的标签（不带 v）时：从源码构建，生成 GitHub 来源认证，再上传到同名 Release。
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 Release、上传文件
      id-token: write # 来源认证需要 OIDC 令牌
      attestations: write # 写入来源认证
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: 标签、manifest、package.json、versions.json 必须一致
        run: |
          tag="${GITHUB_REF_NAME}"
          manifest="$(node -p "require('./manifest.json').version")"
          pkg="$(node -p "require('./package.json').version")"
          mapped="$(node -p "require('./versions.json')['${tag}'] ?? ''")"
          min="$(node -p "require('./manifest.json').minAppVersion")"
          echo "tag=$tag manifest=$manifest package=$pkg versions.json[$tag]=$mapped minAppVersion=$min"
          test "$tag" = "$manifest"
          test "$tag" = "$pkg"
          test "$mapped" = "$min"

      - name: 按锁文件安装依赖
        run: npm ci

      - run: npm run lint
      - run: npm run type-check

      - name: 构建发布文件
        run: npm run build:release

      - name: 核对发布文件
        run: |
          ls -l dist/mobi assets/mobi-offline.bin
          size="$(wc -c < dist/mobi/main.js)"
          echo "main.js = ${size} bytes"
          # Obsidian Sync 标准版单文件上限 5 MB
          test "$size" -lt 5242880
          expected="$(sha256sum assets/mobi-offline.bin | cut -d' ' -f1)"
          grep -q "$expected" dist/mobi/main.js
          cp assets/mobi-offline.bin dist/mobi/mobi-offline.bin

      - name: 生成来源认证
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/mobi/main.js
            dist/mobi/manifest.json
            dist/mobi/styles.css
            dist/mobi/mobi-offline.bin

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" \
            dist/mobi/main.js dist/mobi/manifest.json dist/mobi/styles.css dist/mobi/mobi-offline.bin \
            --clobber
